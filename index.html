<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ithaka · Leesjaar 2027</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A190E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4EEE6; --surface:#FFFCF8; --ink:#2A1D14; --muted:#7A6656; --soft:#5C4A3C;
  --line:#E6DACB; --line2:#D9CAB8; --track:#F1E8DC; --hover:#F4EEE6;
  --accent:#B5541E; --accent-ink:#FFFFFF; --accent-soft:#F6E3D3;
  --ok:#3C8A7A; --danger:#A3352B; --scrim:rgba(42,29,20,.45);
  --hd1:#3E2616; --hd2:#2A190E; --hd-ink:#F6EDE2; --hd-soft:#D9C9B6; --hd-glass:rgba(246,237,226,.09); --sun:#E0873A; --sun-soft:#F6C98A;
  --unplan:#2B4B7A; --tgt:#9C8A78;
  --f-title:'Literata', Georgia, 'Times New Roman', serif;
  --f-ui:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#17110C; --surface:#22180F; --ink:#F1E6D8; --muted:#B8A593; --soft:#D2C1AE;
    --line:#382A1F; --line2:#4A3829; --track:#2A1F16; --hover:#2A1F16;
    --accent:#E0873A; --accent-ink:#22150B; --accent-soft:#3A2414;
    --ok:#6FBFAE; --danger:#E38A80; --scrim:rgba(0,0,0,.55);
    --unplan:#8FB0E3; --tgt:#8C7B6B;
    color-scheme:dark;
  }
  .tag,.tagopt:not(.is-on),.lnm b,.showbtn{color:var(--tag-c)!important}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ground)}

/* kop */
.top{position:relative;background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 100%);color:var(--hd-ink);padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;gap:8px}
h1{margin:0;min-width:0;font-family:var(--f-title);font-weight:600;font-size:23px;letter-spacing:-.01em;white-space:nowrap}
.yearbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;padding:0;cursor:pointer;text-align:left;min-height:44px}
.yearbtn svg{flex:none;opacity:.7;margin-top:3px}
.pillbtn{flex:none;min-height:38px;border:0;border-radius:999px;background:rgba(224,135,58,.16);color:var(--sun-soft);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 10px 0 12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.nowbar{display:flex;align-items:center;gap:10px;min-height:46px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.nowbar .lab{flex:none;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.nowbar .list{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .warn{flex:none;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.nowbar svg{flex:none;color:var(--muted)}
.hbtn{position:relative;width:42px;height:42px;flex:none;border:0;border-radius:12px;background:var(--hd-glass);color:var(--hd-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn.is-on{background:var(--hd-ink);color:#2A1D14}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:#2A1D14;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--hd-glass)}
.segbtn{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--hd-soft);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.segbtn .n{font-weight:500;font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.segbtn.is-on{background:var(--hd-ink);color:#2A1D14}
.segbtn.is-over{background:rgba(224,135,58,.35);color:var(--hd-ink)}
.searchrow{display:flex;gap:8px}
.hsearch{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.hsearch > svg{position:absolute;left:12px;color:#7A6656;pointer-events:none}
.hsearch input{width:100%;min-height:44px;border:0;border-radius:12px;background:#FFFCF8;color:#2A1D14;font:inherit;font-size:16px;padding:0 42px 0 38px;-webkit-appearance:none;appearance:none}
.hsearch input::-webkit-search-cancel-button{display:none}
.hsearch .x{position:absolute;right:2px;width:40px;height:40px;border:0;background:transparent;color:#7A6656;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px}
.progline{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--sun);border-radius:0 2px 2px 0;transition:width .3s ease}

/* actieve filters */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) 2px max(12px,env(safe-area-inset-left,0px))}
.fchip{display:inline-flex;align-items:center;gap:4px;min-height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:0 8px 0 12px;cursor:pointer}
.fchip svg{opacity:.7}
.fclear{min-height:34px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0 6px}

/* lijst */
main{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbar{position:sticky;top:0;z-index:3;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none;margin:0 -2px}
.mbar::-webkit-scrollbar{display:none}
.mchip{flex:none;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.mchip.is-done{color:var(--muted);background:transparent}
.mchip.is-now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.results{margin:12px 6px 2px;font-size:13px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:6px;padding:6px 0 8px;border-radius:14px;border:1.5px dashed transparent}
.sec.is-over{border-color:var(--accent);background:var(--accent-soft)}
.sechead{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;padding:0 6px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.sechead .h{font-family:var(--f-title);font-weight:600;font-size:17px}
.nowtag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sechead .sp{flex:1}
.sechead .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sechead .ok{color:var(--ok);display:flex}
.chev{display:flex;color:var(--muted);transition:transform .15s ease}
.chev.is-open{transform:rotate(180deg)}
.sec.is-collapsed .sechead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.row{position:relative;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 4px 2px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.row.is-done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row.is-dragging{opacity:.3}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--accent);pointer-events:none}
.row.drop-before::before{top:-5px}
.row.drop-after::after{bottom:-5px}
.grip{width:34px;height:44px;flex:none;color:var(--line2);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.st{width:42px;height:44px;flex:none;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-left:-4px}
.st i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.st-open i{border:2px solid var(--muted)}
.st-bezig i{border:2px solid var(--accent);color:var(--accent)}
.st-done i{background:var(--accent);color:var(--accent-ink)}
.txt{flex:1;display:flex;flex-direction:column;min-width:0;gap:1px;padding:6px 0}
.t{font-family:var(--f-title);font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.a{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px 2px 6px;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--tag-d)}
.tag i{width:7px;height:7px;border-radius:50%;display:block;background:var(--tag-c)}
.span{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--soft);background:var(--track);font-variant-numeric:tabular-nums}
.cont{display:flex;align-items:center;gap:8px;min-height:40px;border:1px dashed var(--line2);border-radius:10px;background:transparent;color:var(--muted);font-size:13px;text-align:left;padding:0 12px;cursor:pointer;width:100%}
.cont span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont b{font-weight:600;color:var(--soft)}
.cont em{flex:none;font-style:normal;font-size:12px}
.cont.is-done b{text-decoration:line-through}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--hover)}
.empty{margin:0 6px;padding:8px 0;border-top:1px dashed var(--line2);font-size:13px;color:var(--muted)}

.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(42,29,20,.25);opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}
.slide-l{animation:slideL .22s ease}
.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}

.fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(120,50,15,.35);z-index:5}

/* onderblad */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:40}
.backdrop{position:absolute;inset:0;border:0;background:var(--scrim);cursor:pointer;width:100%}
.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.handle{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2)}
.sheet h3{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tagopt{min-height:38px;border-radius:999px;border:1.5px solid var(--tag-c);background:transparent;color:var(--tag-d);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}
.tagopt.is-on{background:var(--tag-c);color:#FFFFFF}
.addtag{min-height:38px;border-radius:999px;border:1.5px dashed var(--line2);background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}
.destgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dest{min-height:42px;border:1px solid var(--line);background:var(--ground);border-radius:10px;font-size:12.5px;font-weight:500;cursor:pointer}
.dest:hover{border-color:var(--accent)}
.dest.wide{grid-column:span 5}
.dest.is-cur{background:var(--ink);color:var(--ground);border-color:var(--ink);cursor:default}
.seg2{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.seg2 button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13px;color:var(--soft);cursor:pointer}
.seg2 button.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(42,29,20,.12)}
.btnrow{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.photorow{display:flex;gap:12px;flex-wrap:wrap}
.linkbtn.sm{min-height:32px;font-size:13px}
.linkbtn.muted{color:var(--muted)}
.linkbtn{min-height:40px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start;padding:0 2px}
.linkdanger{min-height:44px;border:0;background:transparent;color:var(--danger);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start;padding:0 2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:72px;resize:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.note{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.err{margin:0;font-size:13px;color:var(--danger)}
.tagrow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:0 0 0 4px}
.tagrow.is-edit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tagrowbtn{flex:1;min-width:0;min-height:46px;border:0;background:transparent;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;padding:0 6px}
.tagrowbtn i{width:14px;height:14px;border-radius:50%;display:block;flex:none;background:var(--tag-c)}
.tagrowbtn .tn{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tagrowbtn .tc{font-size:12px;color:var(--muted);flex:none}
.tagrow .sure{min-height:36px;border:0;border-radius:9px;background:var(--danger);color:var(--surface);font-weight:600;font-size:13px;padding:0 12px;margin-right:4px;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:320px}
.sw{aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.sw.is-on{box-shadow:0 0 0 2px var(--ink)}
.preview{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.preview .tag svg{flex:none}
.tico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.swline{display:flex;align-items:center;gap:12px}
.swline span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.swline b{font-size:14px;font-weight:600}
.swline em{font-style:normal;font-size:12.5px;line-height:1.35;color:var(--muted)}
.switch{position:relative;width:48px;height:30px;flex:none;border:0;border-radius:15px;background:var(--line2);cursor:pointer;padding:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(42,29,20,.3);transition:left .15s}
.switch.is-on{background:var(--accent)}
.switch.is-on::after{left:21px}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:340px}
.icb{height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
.icb.is-on{border:2px solid var(--tag-c);color:var(--tag-c)}
.tagopt.is-line{display:inline-flex;align-items:center;gap:6px;padding-left:10px}
.tagopt.is-line svg{flex:none}
.fchip.is-line{gap:6px;padding-left:10px}
.syms{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin-right:-6px}
.sym{display:flex;color:var(--tag-c)}
.lanes{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.lh{display:grid;grid-template-columns:24px minmax(0,1fr) auto 20px;column-gap:10px;align-items:center;min-height:52px;width:100%;border:0;border-radius:12px;background:transparent;padding:4px 8px;text-align:left;cursor:pointer;color:var(--ink)}
.lh.is-open{background:var(--track)}
.lic{display:flex;justify-content:center;color:var(--tag-c)}
.lnm{display:flex;flex-direction:column;gap:6px;min-width:0}
.lnm b{font-size:14.5px;font-weight:700;color:var(--tag-d);overflow-wrap:anywhere}
.segs{display:flex;gap:2px}
.segs i{flex:1;height:5px;border-radius:2px;display:block;background:var(--tag-c);opacity:.22}
.segs i.is-bezig{opacity:.6}
.segs i.is-done{opacity:1}
.lct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lbody{display:flex;flex-direction:column;padding:4px 8px 12px 42px}
.drow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:32px}
.drow .d{width:10px;height:10px;border-radius:50%;border:2px solid var(--tag-c);background:var(--surface)}
.drow .d.is-done{background:var(--tag-c)}
.drow .d.is-bezig{background:linear-gradient(90deg,var(--tag-c) 50%,var(--surface) 50%)}
.drow .bt{font-family:var(--f-title);font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.drow.is-done .bt{color:var(--muted)}
.drow .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.showbtn{align-self:flex-start;margin-top:8px;min-height:40px;border:1.5px solid var(--tag-c);border-radius:10px;background:transparent;color:var(--tag-d);font-weight:600;font-size:13.5px;padding:0 14px;cursor:pointer}
.datefields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.brow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.brow .bt{flex:1;min-width:0;display:flex;flex-direction:column}
.brow .bt b{font-family:var(--f-title);font-weight:500;font-size:15px;overflow-wrap:anywhere}
.brow .bt span{font-size:12.5px;color:var(--muted)}
.days{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.days.is-old{color:var(--danger);font-weight:700}
.rdone{flex:none;min-height:38px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:0 14px;cursor:pointer}

/* toevoegen & scannen */
.scanbig{display:flex;align-items:center;gap:14px;min-height:72px;border:0;border-radius:16px;background:linear-gradient(160deg,#4A2A15 0%,#2A190E 100%);color:#F6EDE2;padding:0 16px;text-align:left;cursor:pointer;width:100%;flex:none}
.scanbig .ic{width:44px;height:44px;border-radius:12px;background:rgba(246,237,226,.12);display:flex;align-items:center;justify-content:center;flex:none;color:#F6C98A}
.scanbig b{display:block;font-size:16px;font-weight:700}
.scanbig span span{font-size:12.5px;color:#D9C9B6}
.or{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
.isbnrow{display:flex;gap:8px}
.isbnrow input{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.isbnrow .btn{flex:none;min-height:46px;padding:0 16px}
.found{display:flex;gap:12px;align-items:flex-start}
.cover{position:relative;overflow:hidden;flex:none;width:56px;height:84px;border-radius:4px;background:var(--track);box-shadow:0 4px 10px rgba(42,29,20,.18)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.is-none{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.fmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.src{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#1F5A4E;background:#DCEFEA;border-radius:999px;padding:3px 8px}
.src.is-miss{color:#82231A;background:#F8E3E0}
.facts{font-size:12.5px;line-height:1.4;color:var(--muted)}
.dup{display:flex;gap:10px;align-items:flex-start;background:#FBEFD9;color:#5E4210;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.dup svg{flex:none;margin-top:1px}
.scan{position:fixed;inset:0;z-index:70;background:#0E0A07;color:#F6EDE2;overflow:hidden}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:8%;right:8%;top:34%;height:17%;border-radius:14px;box-shadow:0 0 0 2px rgba(246,237,226,.9),0 0 0 3000px rgba(0,0,0,.45)}
.scan-frame::after{content:'';position:absolute;left:12px;right:12px;top:50%;height:2px;background:#E0873A;box-shadow:0 0 12px #E0873A;animation:scanline 1.8s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(-22px);opacity:.5}50%{transform:translateY(22px);opacity:1}}
.scan-frame.is-hit{box-shadow:0 0 0 3px #6FBFAE,0 0 0 3000px rgba(0,0,0,.45)}
.scan-frame.is-hit::after{display:none}
.scan-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px}
.scan-top b{flex:1;font-size:15px;font-weight:600}
.cbtn{width:44px;height:44px;border:0;border-radius:22px;background:rgba(14,10,7,.55);color:#F6EDE2;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cbtn.is-on{background:#F6C98A;color:#2A1D14}
.scan-msg{position:absolute;left:24px;right:24px;top:calc(51% + 18px);margin:0;text-align:center;font-size:14.5px;line-height:1.45;color:rgba(246,237,226,.92)}
.scan-foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:18px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.typebtn{min-height:46px;border:1px solid rgba(246,237,226,.4);border-radius:12px;background:rgba(14,10,7,.55);color:#F6EDE2;font-weight:600;font-size:14px;padding:0 16px;cursor:pointer}
@media (prefers-color-scheme: dark){ .dup{background:#3A2C12;color:#F1D9A8} .src{background:#173A33;color:#9FD8CB} .src.is-miss{background:#3A1A16;color:#F0A9A0} }
/* bladzijden */
.pg{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px;white-space:nowrap}
.apg{white-space:nowrap;font-variant-numeric:tabular-nums}
.eds{display:flex;flex-direction:column;gap:6px}
.ed{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.ed.is-cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ed .et{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ed .et b{font-size:14px;font-weight:600}
.ed .et span{font-size:12.5px;color:var(--soft);line-height:1.35}
.ed .et em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed .ep{flex:none;text-align:right;font-family:var(--f-title);font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ed .ep small{display:block;font-family:var(--f-ui);font-size:11px;font-weight:500;color:var(--muted);line-height:1.3}
.pgnote{margin:0;font-size:13px;line-height:1.45;color:var(--soft)}
/* welkom & back-up */
.welcome{margin:12px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.welcome h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px}
.welcome p{margin:0;font-size:14px;line-height:1.5;color:var(--soft)}
.codebox{border:1px solid var(--line);border-radius:12px;padding:0 12px}
.codebox summary{min-height:46px;display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--soft);cursor:pointer}
.codebox[open]{padding-bottom:12px}
.codebox[open] > *:not(summary){margin-top:10px}
/* boekkaart */
.row .txt{cursor:pointer}
.arate{white-space:nowrap;margin-left:6px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.anote{display:inline-flex;vertical-align:-1px;margin-left:6px;color:var(--muted)}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dcover{width:64px;height:96px}
.dmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dwhere{align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);background:var(--track);border-radius:999px;padding:3px 8px}
.rate{display:flex;align-items:center;gap:12px}
.stars{display:flex;gap:2px}
.star{position:relative;width:36px;height:36px;display:block}
.star svg{position:absolute;inset:3px;width:30px;height:30px}
.star .s-empty path{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-linejoin:round}
.star .s-fill{position:absolute;left:0;top:0;bottom:0;overflow:hidden;pointer-events:none}
.star .s-fill svg{left:3px;top:3px;inset:auto;position:absolute}
.star .s-fill path{fill:var(--accent);stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.s-hit{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;padding:0;cursor:pointer}
.s-hit.l{left:0}.s-hit.r{right:0}
.rval{font-family:var(--f-title);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:32px}
.notes{min-height:110px!important;resize:none;font-family:var(--f-ui)!important;font-size:15px!important;line-height:1.5}
.saved{font-weight:500;font-size:12px;color:var(--ok);margin-left:6px}
/* leesjaren */
.yrow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding-right:4px}
.yrow.is-cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ypick{flex:1;display:flex;align-items:center;gap:12px;min-height:60px;border:0;background:transparent;padding:0 14px;text-align:left;cursor:pointer;color:inherit}
.ypick .yy{font-family:var(--f-title);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;width:58px}
.ypick .yt{display:flex;flex-direction:column;gap:2px}
.ypick .yt b{font-size:14px;font-weight:600}
.ypick .yt span{font-size:12.5px;color:var(--muted)}
/* waardering & tempo */
.sr{display:grid;grid-template-columns:52px minmax(0,1fr) 28px;column-gap:8px;align-items:center;min-height:24px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.sr .bar{height:9px;border-radius:5px;background:var(--track);overflow:hidden}
.sr .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.sr .c{text-align:right}
.cmp{display:flex;flex-direction:column}
.cscale,.crow{display:grid;grid-template-columns:118px minmax(0,1fr) 34px;column-gap:10px;align-items:center}
.cscale{font-size:10.5px;font-weight:700;color:var(--muted)}
.ticks{display:flex;justify-content:space-between}
.crow{min-height:44px;border-top:1px solid var(--line)}
.crow.is-sep{border-top:1.5px solid var(--line2)}
.cl{display:flex;flex-direction:column;min-width:0}
.cl b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl span{font-size:11.5px;color:var(--muted)}
.ctrack{position:relative;height:24px}
.ctrack::before{content:'';position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line);border-radius:1px}
.cavg{position:absolute;top:4px;width:2px;height:16px;margin-left:-1px;background:var(--tgt);border-radius:1px}
.cdot{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(42,29,20,.15)}
.cv{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.insight{margin:0;font-size:13.5px;line-height:1.45;background:var(--ground);border-radius:12px;padding:10px 12px}
.toplist{display:flex;flex-direction:column}
.tbook{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 0;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.tbook b{font-family:var(--f-title);font-weight:500;font-size:14.5px}
.tbook span{font-size:12px;color:var(--muted)}
.tstar{font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.irows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:40px;border-bottom:1px solid var(--line);font-size:14px}
.irow b{font-family:var(--f-title);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.irow span{color:var(--soft)}
.imptag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:1px}
.ayrs{display:flex;flex-direction:column}
.ayr{display:grid;grid-template-columns:44px minmax(0,1fr) 26px 72px 40px;column-gap:8px;align-items:center;min-height:40px;border:0;border-top:1px solid var(--line);background:transparent;padding:0;text-align:left;color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
button.ayr{cursor:pointer}
.ayr b{font-family:var(--f-title);font-weight:600;font-size:15px}
.ayr .bar{height:9px;border-radius:5px;background:var(--track);overflow:hidden}
.ayr .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ayr .an{text-align:right;font-weight:700}
.ayr .ap,.ayr .ar{text-align:right;color:var(--muted)}
.ycells i{opacity:1}
.alanes .lct{min-width:74px;text-align:right}
.yaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 122px 0 42px;font-variant-numeric:tabular-nums}
.tempo{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tempo div{background:var(--ground);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.tempo b{font-family:var(--f-title);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tempo span{font-size:12px;color:var(--muted);line-height:1.3}
/* zoeken over jaren */
.scoperow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.seg2.sm{padding:2px}
.seg2.sm button{min-height:34px;font-size:12.5px;padding:0 10px}
.sechead.is-static{cursor:default}
.row.no-drag .grip{visibility:hidden}
/* statistieken */
.stats{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--ground);max-width:560px;margin:0 auto}
.shead{background:linear-gradient(180deg,var(--hd1),var(--hd2));color:var(--hd-ink);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.shead h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:21px}
.sbody{flex:1;overflow-y:auto;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--f-title);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:14px;color:var(--soft)}
.ratio{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track)}
.ratio i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.legend .tgt{border:1.5px dashed var(--tgt);background:transparent}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--ground);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kv b{font-family:var(--f-title);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:140px;border-bottom:1px solid var(--line2);padding-top:6px}
.col{position:relative;height:130px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:6px}
.col.is-sel{background:var(--accent-soft)}
.col .tg{position:absolute;bottom:0;left:3px;right:3px;border:1.5px dashed var(--tgt);border-bottom:0;border-radius:4px 4px 0 0}
.col .u{width:calc(100% - 10px);background:var(--unplan);border-radius:3px 3px 0 0}
.col .p{width:calc(100% - 10px);background:var(--accent)}
.col.is-future{opacity:.45}
.axis{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.axis .is-now{color:var(--accent)}
.detail{font-size:13.5px;line-height:1.45;background:var(--ground);border-radius:12px;padding:10px 12px}
.tlm{font-family:var(--f-title);font-weight:600;font-size:16px;padding:10px 0 4px}
.tli{display:grid;grid-template-columns:52px 18px minmax(0,1fr);align-items:start;column-gap:8px;padding:4px 0 8px;position:relative}
.tli .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.tli .dot{width:12px;height:12px;border-radius:50%;margin:4px auto 0;position:relative;z-index:1}
.tli .line{position:absolute;left:60px;top:0;bottom:0;width:18px;display:flex;justify-content:center;pointer-events:none}
.tli .line i{width:2px;background:var(--line);display:block}
.tli .bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tli .bt b{font-family:var(--f-title);font-weight:500;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.tli .bt span{font-size:12.5px;color:var(--muted)}
.tli .bt em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--soft)}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="toprow">
      <button class="yearbtn" id="btn-year" aria-label="Kies een leesjaar"><h1 id="yeartitle">Leesjaar</h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="pillbtn" id="btn-stats" aria-label="Statistieken">
        <span id="pill"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12"/><path d="M12 20V5"/><path d="M19 20v-9"/></svg>
      </button>
      <button class="hbtn" id="btn-search" aria-label="Zoeken en filteren" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="badge" id="badge" hidden></span>
      </button>
      <button class="hbtn" id="btn-backup" aria-label="Back-up maken of herstellen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      </button>
    </div>
    <div class="seg" role="tablist">
      <button class="segbtn" id="tab-plan" role="tab" data-spring="plan">Planning <span class="n" id="n-plan"></span></button>
      <button class="segbtn" id="tab-stock" role="tab" data-spring="stock" data-drop="voorraad">Voorraad <span class="n" id="n-stock"></span></button>
    </div>
    <div class="searchrow" id="searchrow" hidden>
      <div class="hsearch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Zoek op titel of schrijver" autocomplete="off" enterkeyhint="search" aria-label="Zoek op titel of schrijver">
        <button class="x" id="q-clear" aria-label="Zoekterm wissen" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="hbtn" id="btn-filter" aria-label="Filters op tag, status en schrijver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
      </button>
    </div>
    <i class="progline" id="progline" aria-hidden="true"></i>
  </header>

  <button class="nowbar" id="nowbar" hidden>
    <span class="lab">Nu bezig</span>
    <span class="list" id="nowlist"></span>
    <span class="warn" id="nowwarn" hidden aria-hidden="true"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="fchips" id="fchips" hidden></div>

  <main id="list" aria-live="polite"></main>

  <button class="fab" id="btn-add" aria-label="Boek toevoegen">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>
</div>

<div class="overlay" id="overlay" hidden>
  <button class="backdrop" id="backdrop" aria-label="Sluiten"></button>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

  // ---------- ISBN ----------
  function isbnDigits(v) { return String(v || '').toUpperCase().replace(/[^0-9X]/g, ''); }
  function isbn13ok(d) {
    if (!/^97[89]\d{10}$/.test(d)) return false;
    var sum = 0; for (var i = 0; i < 12; i++) sum += (+d[i]) * (i % 2 ? 3 : 1);
    return (10 - sum % 10) % 10 === +d[12];
  }
  function isbn10ok(d) {
