<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ithaka · Leesjaar 2027</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F3F0; --surface:#FFFFFF; --ink:#1B2026; --muted:#5D6570; --soft:#4E5661;
  --line:#DADDD6; --line2:#C9CDC4; --track:#E4E6E0; --bar:#DFE2DB;
  --accent:#2C4F86; --accent-soft:#E8EEF7; --accent-mid:#DCE4F1; --on-accent:#FFFFFF;
  --danger:#A3352B; --hover:#F0F2EE; --scrim:rgba(27,32,38,.38);
  --f-title:'Literata', Georgia, 'Times New Roman', serif;
  --f-ui:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#15181C; --surface:#1E2227; --ink:#E7E9EC; --muted:#9BA2AC; --soft:#B4BAC2;
    --line:#2E333A; --line2:#3A4048; --track:#23272D; --bar:#2B3037;
    --accent:#8FB0E3; --accent-soft:#1F2A3B; --accent-mid:#24324A; --on-accent:#10151C;
    --danger:#E38A80; --hover:#262B31; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;background:var(--ground)}
.toprow{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-family:var(--f-title);font-weight:600;font-size:27px;letter-spacing:-.01em}
.prog{display:flex;flex-direction:column;gap:6px}
.progtxt{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .25s ease}
.tabs{display:flex;gap:4px;padding:4px;background:var(--track);border-radius:13px}
.tab{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab.is-over{background:var(--accent-mid);color:var(--ink)}
.tab .n{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(12px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px;padding:10px 8px 12px;border-radius:14px;border:1.5px dashed transparent;scroll-margin-top:4px}
.sec.is-over{border-color:var(--accent);background:var(--accent-soft)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px}
.sechead h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:17px}
.sechead span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec.is-now .sechead h2::after{content:"nu";margin-left:8px;font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);vertical-align:2px}

.row{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.row.is-done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row.is-dragging{opacity:.3}
.row{position:relative}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--accent);pointer-events:none}
.row.drop-before::before{top:-5px}
.row.drop-after::after{bottom:-5px}
.grip{width:34px;height:44px;margin:0 -6px 0 -4px;flex:none;color:var(--muted);opacity:.75;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.chk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.txt{display:flex;flex-direction:column;min-width:0}
.t{font-family:var(--f-title);font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.a{font-size:12.5px;color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;color:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--hover)}
.empty{margin:0;padding:12px 10px;border:1px dashed var(--line2);border-radius:12px;font-size:13px;color:var(--muted);text-align:center}

.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.search > svg{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 42px 0 38px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input.is-active,#f-auth.is-active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.search .clear{position:absolute;right:2px;width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
#f-auth{flex:none;width:38%;max-width:180px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
.filterinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 2px;font-size:13px;color:var(--soft)}
.filterinfo button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.slide-l{animation:slideL .22s ease}
.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.22);transform-origin:center;opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}

.fab{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(44,79,134,.35);z-index:5}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:40}
.backdrop{position:absolute;inset:0;border:0;background:var(--scrim);cursor:pointer;width:100%}
.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.handle{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2)}
.sheet h3{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.destgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dest{min-height:44px;border:1px solid var(--line);background:var(--ground);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
.dest:hover{background:var(--accent-soft);border-color:var(--accent)}
.dest.wide{grid-column:span 2}
.dest.is-cur{background:var(--ink);color:var(--ground);border-color:var(--ink);cursor:default}
.btnrow{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.linkdanger{min-height:44px;border:0;background:transparent;color:var(--danger);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start;padding:0 2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:72px;resize:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.note{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.err{margin:0;font-size:13px;color:var(--danger)}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="toprow">
      <h1>Leesjaar 2027</h1>
      <button class="iconbtn" id="btn-backup" aria-label="Back-up maken of herstellen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      </button>
    </div>
    <div class="prog">
      <div class="progtxt"><span id="prog-text"></span><span id="prog-pct"></span></div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-plan" role="tab" data-spring="plan">Planning <span class="n" id="n-plan"></span></button>
      <button class="tab" id="tab-stock" role="tab" data-spring="stock" data-drop="voorraad">Voorraad <span class="n" id="n-stock"></span></button>
    </div>
    <div class="searchrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Zoek op titel of schrijver" autocomplete="off" enterkeyhint="search" aria-label="Zoek op titel of schrijver">
        <button class="clear" id="q-clear" aria-label="Zoekterm wissen" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <select id="f-auth" aria-label="Filter op schrijver"><option value="">Alle schrijvers</option></select>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>

  <button class="fab" id="btn-add" aria-label="Boek toevoegen">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>
</div>

<div class="overlay" id="overlay" hidden>
  <button class="backdrop" id="backdrop" aria-label="Sluiten"></button>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  var KEY = 'ithaka.v1';
  var YEAR = 2027;
  var MONTHS = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
  var SHORT = ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  var DESTS = [{ key: 'door', label: 'Doorlopend', short: 'Doorlopend', wide: true }];
  for (var i = 0; i < 12; i++) DESTS.push({ key: String(i + 1), label: MONTHS[i], short: SHORT[i], wide: false });
  DESTS.push({ key: 'voorraad', label: 'Voorraad', short: 'Voorraad', wide: true });
  function destLabel(k) { for (var i = 0; i < DESTS.length; i++) if (DESTS[i].key === k) return DESTS[i].label; return k; }

  var SEED = [
    ['door','De brief aan de Romeinen','Karl Barth'],
    ['door','De vrolijke wetenschap','Friedrich Nietzsche'],
    ['1','Ilias','Homerus'],
    ['1','Woeste Hoogten','Emily Brontë'],
    ['1','Wat ik geloof','Lev Tolstoj'],
    ['1','Terwijl ik al heenging (herlezen, optioneel)','William Faulkner'],
    ['2','Odyssee','Homerus'],
    ['2','Metamorphosen XII–XIII','Ovidius'],
    ['2','Het geluid en de drift','William Faulkner'],
    ['2','Het martyrium','Elias Canetti'],
    ['2','De vraag naar de mens','Martin Buber'],
    ['3','Aeneis','Vergilius'],
    ['3','Metamorphosen XIII–XIV','Ovidius'],
    ['3','Radetzkymars','Joseph Roth'],
    ['3','Ik en Jij','Martin Buber'],
    ['3','De goddelijke komedie (26 mrt – 16 mei)','Dante'],
    ['4','De wereld van gisteren','Stefan Zweig'],
    ['4','Filosofische onderzoekingen (t/m juni)','Ludwig Wittgenstein'],
    ['5','De Aleph (titelverhaal, na Dante)','Jorge Luis Borges'],
    ['5','Hamlet','William Shakespeare'],
    ['5','Ulysses (uit op 16 juni)','James Joyce'],
    ['6','Bekentenissen van Zeno','Italo Svevo'],
    ['6','Mevrouw Dalloway','Virginia Woolf'],
    ['6','De geboorte van de tragedie','Friedrich Nietzsche'],
    ['7','Jouw gezicht morgen','Javier Marías'],
    ['7','Gödel, Escher, Bach (t/m augustus)','Douglas Hofstadter'],
    ['8','De medeplichtige','György Konrád'],
    ['8','Tonio Kröger & De dood in Venetië','Thomas Mann'],
    ['8','De meester en zijn afgezant (t/m september)','Iain McGilchrist'],
    ['9','Doktor Faustus','Thomas Mann'],
    ['9','Gesprekken met de duivel','Leszek Kolakowski'],
    ['9','De kapiteinsdochter','Aleksandr Poesjkin'],
    ['9','De mantel / De neus / Dagboek van een gek','Nikolaj Gogol'],
    ['10','Lucifer','Connie Palmen'],
    ['10','Dode zielen','Nikolaj Gogol'],
    ['10','Roedin & Een adelsnest','Ivan Toergenjev'],
    ['10','Het Koninkrijk Gods is binnen in u','Lev Tolstoj'],
    ['11','Opstanding','Lev Tolstoj'],
    ['11','De meester van Petersburg','J.M. Coetzee'],
    ['11','2666','Roberto Bolaño'],
    ['12','Metamorphosen I','Ovidius'],
    ['12','De zondvloed','Jeroen Brouwers'],
    ['12','De genealogie van de moraal','Friedrich Nietzsche'],
    ['12','Bijbels ABC (optioneel)','K.H. Miskotte'],
    ['voorraad','Elizabeth Costello','J.M. Coetzee'],
    ['voorraad','Dagboek van een slecht jaar','J.M. Coetzee'],
    ['voorraad','Zomertijd','J.M. Coetzee'],
    ['voorraad','Genezen verklaard','Graham Greene'],
    ['voorraad','Het leven op aarde','J. Slauerhoff'],
    ['voorraad','De man zonder eigenschappen (na april)','Robert Musil'],
    ['voorraad','Een liefde van Swann','Marcel Proust'],
    ['voorraad','Reis naar het einde van de nacht','Louis-Ferdinand Céline'],
    ['voorraad','De stad der zienden','José Saramago'],
    ['voorraad','Een zeeman door de zee verstoten','Yukio Mishima'],
    ['voorraad','Kapitein Michalis','Nikos Kazantzakis'],
    ['voorraad','Het achtste leven (voor Brilka)','Nino Haratischwili'],
    ['voorraad','Zelfportretten','Osamu Dazai'],
    ['voorraad','De tranen der acacia’s','Willem Frederik Hermans'],
    ['voorraad','Het sadistische universum','Willem Frederik Hermans'],
    ['voorraad','De zaak 40/61','Harry Mulisch'],
    ['voorraad','In Babylon','Marcel Möring'],
    ['voorraad','Max, Mischa & het Tet-offensief','Johan Harstad'],
    ['voorraad','De ideale staat','Plato']
  ];

  // ---------- opslag ----------
  function seedState() {
    return {
      v: 1, tab: 'plan', nextId: SEED.length + 1,
      books: SEED.map(function (r, i) { return { id: 'b' + (i + 1), m: r[0], t: r[1], a: r[2], done: false }; })
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.books)) return { v: 1, tab: d.tab === 'stock' ? 'stock' : 'plan', nextId: d.nextId || 1000, books: d.books };
      }
    } catch (e) {}
    return seedState();
  }
  var state = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  save();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- hulpjes ----------
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function find(id) { for (var i = 0; i < state.books.length; i++) if (state.books[i].id === id) return state.books[i]; return null; }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 1800);
  }
  function nowKey() { var d = new Date(); return d.getFullYear() === YEAR ? String(d.getMonth() + 1) : null; }

  var ICON_GRIP = '<svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg>';
  var ICON_MORE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

  // ---------- weergave ----------
  var list = $('list');

  function rowHTML(b) {
    return '<div class="row' + (b.done ? ' is-done' : '') + '" data-id="' + esc(b.id) + '">' +
      '<span class="grip" aria-hidden="true">' + ICON_GRIP + '</span>' +
      '<label class="chk"><input type="checkbox" data-act="toggle"' + (b.done ? ' checked' : '') + '>' +
      '<span class="txt"><span class="t">' + esc(b.t) + '</span>' + (b.a ? '<span class="a">' + esc(b.a) + '</span>' : '') + '</span></label>' +
      '<button class="iconbtn" data-act="more" aria-label="Opties voor ' + esc(b.t) + '">' + ICON_MORE + '</button>' +
      '</div>';
  }
  // ---------- zoeken & filter ----------
  var filter = { q: '', author: '' };
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function filtering() { return filter.q.trim() !== '' || filter.author !== ''; }
  function matches(b) {
    if (filter.author && b.a !== filter.author) return false;
    var q = norm(filter.q.trim()); if (!q) return true;
    var hay = norm(b.t + ' ' + b.a);
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function renderAuthors() {
    var sel = $('f-auth');
    var names = [];
    state.books.forEach(function (b) { if (b.a && names.indexOf(b.a) < 0) names.push(b.a); });
    names.sort(function (x, y) { return x.localeCompare(y, 'nl'); });
    if (filter.author && names.indexOf(filter.author) < 0) filter.author = '';
    sel.innerHTML = '<option value="">Alle schrijvers</option>' + names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    sel.value = filter.author;
  }
  function updateFilterUI() {
    $('q-clear').hidden = filter.q === '';
    $('q').classList.toggle('is-active', filter.q.trim() !== '');
    $('f-auth').classList.toggle('is-active', filter.author !== '');
  }
  function clearFilters() {
    filter.q = ''; filter.author = '';
    $('q').value = ''; $('f-auth').value = '';
    updateFilterUI(); render(); list.scrollTop = 0;
  }

  function secHTML(d, filtered) {
    var items = state.books.filter(function (b) { return b.m === d.key && (!filtered || matches(b)); });
    if (filtered && !items.length) return '';
    var doneN = items.filter(function (b) { return b.done; }).length;
    var now = nowKey() === d.key ? ' is-now' : '';
    return '<section class="sec' + now + '" data-drop="' + d.key + '" id="sec-' + d.key + '">' +
      '<div class="sechead"><h2>' + esc(d.label) + '</h2><span>' + (items.length ? doneN + '/' + items.length : '') + '</span></div>' +
      (items.length ? items.map(rowHTML).join('') : '<p class="empty">Nog leeg. Sleep een boek hierheen of tik op +.</p>') +
      '</section>';
  }
  function renderHeader() {
    var planned = state.books.filter(function (b) { return b.m !== 'voorraad'; });
    var doneN = planned.filter(function (b) { return b.done; }).length;
    var pct = planned.length ? Math.round(doneN / planned.length * 100) : 0;
    $('prog-text').textContent = doneN + ' van ' + planned.length + ' gelezen';
    $('prog-pct').textContent = pct + '%';
    $('prog-bar').style.width = pct + '%';
    $('n-plan').textContent = planned.length;
    $('n-stock').textContent = state.books.length - planned.length;
    var f = filtering();
    $('tab-plan').classList.toggle('is-on', !f && state.tab === 'plan');
    $('tab-stock').classList.toggle('is-on', !f && state.tab === 'stock');
    $('tab-plan').setAttribute('aria-selected', !f && state.tab === 'plan');
    $('tab-stock').setAttribute('aria-selected', !f && state.tab === 'stock');
  }
  function render() {
    renderHeader();
    renderAuthors();
    var f = filtering();
    // Tijdens zoeken: resultaten uit planning én voorraad, alleen maanden met treffers.
    var secs = f ? DESTS : (state.tab === 'plan' ? DESTS.filter(function (d) { return d.key !== 'voorraad'; }) : [DESTS[DESTS.length - 1]]);
    var html = secs.map(function (d) { return secHTML(d, f); }).join('');
    if (f) {
      var n = state.books.filter(matches).length;
      html = '<div class="filterinfo"><span>' + (n ? n + (n === 1 ? ' boek' : ' boeken') + ' gevonden' : 'Niets gevonden') + '</span>' +
        '<button data-act="clearfilters">Wis zoeken</button></div>' + html;
    }
    list.innerHTML = html;
  }
  function goTab(t) {
    if (filtering()) { filter.q = ''; filter.author = ''; $('q').value = ''; updateFilterUI(); }
    if (state.tab !== t) { state.tab = t; save(); list.scrollTop = 0; }
    render();
  }
  function swipeTo(t, cls) {
    if (state.tab === t) return;
    state.tab = t; save(); render(); list.scrollTop = 0;
    list.classList.remove('slide-l', 'slide-r'); void list.offsetWidth; list.classList.add(cls);
  }
  function setTab(tab) {
    if (state.tab === tab) return;
    state.tab = tab; save(); render(); list.scrollTop = 0;
  }

  // ---------- acties ----------
  // Verplaats een boek naar een maand/voorraad. Met beforeId komt het vóór dat boek,
  // zonder beforeId achteraan in die maand. Werkt ook binnen dezelfde maand (volgorde).
  function moveTo(id, key, beforeId) {
    var b = find(id); if (!b) return;
    var from = b.m;
    var idx = state.books.indexOf(b);
    var rest = state.books.slice(0, idx).concat(state.books.slice(idx + 1));
    var at = -1, i;
    if (beforeId && beforeId !== id) {
      for (i = 0; i < rest.length; i++) if (rest[i].id === beforeId) { at = i; break; }
    }
    if (at < 0) {
      at = rest.length;
      for (i = rest.length - 1; i >= 0; i--) if (rest[i].m === key) { at = i + 1; break; }
    }
    rest.splice(at, 0, b);
    var same = from === key && rest.every(function (x, j) { return x === state.books[j]; });
    if (same) return;
    b.m = key; state.books = rest; save(); render();
    if (from !== key) toast('Verplaatst naar ' + destLabel(key));
  }

  list.addEventListener('change', function (e) {
    var cb = e.target.closest('input[data-act="toggle"]'); if (!cb) return;
    var row = cb.closest('.row'); var b = find(row.dataset.id); if (!b) return;
    b.done = cb.checked; save();
    row.classList.toggle('is-done', b.done);
    var sec = row.closest('.sec');
    if (sec) {
      var key = sec.dataset.drop;
      var items = state.books.filter(function (x) { return x.m === key; });
      sec.querySelector('.sechead span').textContent = items.filter(function (x) { return x.done; }).length + '/' + items.length;
    }
    renderHeader();
  });
  list.addEventListener('click', function (e) {
    if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
    if (e.target.closest('button[data-act="clearfilters"]')) { clearFilters(); return; }
    var btn = e.target.closest('button[data-act="more"]'); if (!btn) return;
    openActions(btn.closest('.row').dataset.id);
  }, true);

  $('tab-plan').addEventListener('click', function () { goTab('plan'); });
  $('tab-stock').addEventListener('click', function () { goTab('stock'); });
  $('q').addEventListener('input', function () { filter.q = this.value; updateFilterUI(); render(); list.scrollTop = 0; });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('q-clear').addEventListener('click', function () { filter.q = ''; $('q').value = ''; updateFilterUI(); render(); $('q').focus(); });
  $('f-auth').addEventListener('change', function () { filter.author = this.value; updateFilterUI(); render(); list.scrollTop = 0; });

  // vegen tussen Planning en Voorraad
  var sw = null;
  list.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { sw = null; return; }
    var t = e.touches[0]; sw = { x: t.clientX, y: t.clientY, dx: 0, dy: 0, at: Date.now(), blocked: false };
  }, { passive: true });
  list.addEventListener('touchmove', function (e) {
    if (!sw) return; var t = e.touches[0]; sw.dx = t.clientX - sw.x; sw.dy = t.clientY - sw.y;
  }, { passive: true });
  list.addEventListener('touchend', function () {
    var s = sw; sw = null;
    if (!s || s.blocked || filtering()) return;
    if (Math.abs(s.dx) > 70 && Math.abs(s.dx) > Math.abs(s.dy) * 1.6 && Date.now() - s.at < 800) {
      if (s.dx < 0) swipeTo('stock', 'slide-l'); else swipeTo('plan', 'slide-r');
    }
  });
  $('btn-add').addEventListener('click', openAdd);
  $('btn-backup').addEventListener('click', openBackup);

  // ---------- onderblad ----------
  var overlay = $('overlay'), sheet = $('sheet'), lastFocus = null;
  function openSheet(label, html, focusSel) {
    lastFocus = document.activeElement;
    $('toast').hidden = true;
    sheet.setAttribute('aria-label', label);
    sheet.innerHTML = '<span class="handle" aria-hidden="true"></span>' + html;
    overlay.hidden = false;
    var f = focusSel ? sheet.querySelector(focusSel) : null;
    if (f) setTimeout(function () { f.focus(); }, 60);
  }
  function closeSheet() {
    overlay.hidden = true; sheet.innerHTML = '';
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  }
  $('backdrop').addEventListener('click', closeSheet);
  overlay.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function openActions(id) {
    var b = find(id); if (!b) return;
    var grid = DESTS.map(function (d) {
      var cur = d.key === b.m;
      return '<button class="dest' + (d.wide ? ' wide' : '') + (cur ? ' is-cur' : '') + '" data-dest="' + d.key + '"' + (cur ? ' disabled aria-current="true"' : '') + '>' + d.short + '</button>';
    }).join('');
    openSheet('Opties voor ' + b.t,
      '<div style="display:flex;flex-direction:column;gap:2px"><h3>' + esc(b.t) + '</h3>' + (b.a ? '<span class="a">' + esc(b.a) + '</span>' : '') + '</div>' +
      '<button class="btn" id="edit-open" style="flex:none">Titel of schrijver aanpassen</button>' +
      '<p class="lbl">Verplaats naar</p><div class="destgrid">' + grid + '</div>' +
      '<div id="delzone"><button class="linkdanger" id="ask-del">Verwijder uit de lijst</button></div>');
    sheet.querySelectorAll('[data-dest]').forEach(function (el) {
      el.addEventListener('click', function () { closeSheet(); moveTo(id, el.dataset.dest); });
    });
    $('edit-open').addEventListener('click', function () { openEdit(id); });
    $('ask-del').addEventListener('click', function () {
      $('delzone').innerHTML = '<p class="note" style="margin-bottom:10px">Dit boek verdwijnt uit je planning en voorraad.</p>' +
        '<div class="btnrow"><button class="btn" id="del-no">Annuleer</button><button class="btn danger" id="del-yes">Verwijder</button></div>';
      $('del-no').addEventListener('click', closeSheet);
      $('del-yes').addEventListener('click', function () {
        state.books = state.books.filter(function (x) { return x.id !== id; });
        save(); closeSheet(); render(); toast('Verwijderd');
      });
      $('del-yes').focus();
    });
  }

  function openEdit(id) {
    var b = find(id); if (!b) return;
    openSheet('Boek aanpassen',
      '<h3>Boek aanpassen</h3>' +
      '<form id="editform" style="display:flex;flex-direction:column;gap:12px" novalidate>' +
      '<div class="field"><label for="e-title">Titel</label><input id="e-title" type="text" autocomplete="off" required></div>' +
      '<div class="field"><label for="e-author">Auteur</label><input id="e-author" type="text" autocomplete="off"></div>' +
      '<div class="btnrow"><button type="button" class="btn" id="edit-no">Annuleer</button><button type="submit" class="btn primary" id="edit-yes">Bewaar</button></div>' +
      '</form>', '#e-title');
    var ti = $('e-title'), au = $('e-author');
    ti.value = b.t; au.value = b.a || '';
    ti.addEventListener('input', function () { $('edit-yes').disabled = ti.value.trim() === ''; });
    $('edit-no').addEventListener('click', closeSheet);
    $('editform').addEventListener('submit', function (e) {
      e.preventDefault();
      var t = ti.value.trim(); if (!t) return;
      b.t = t; b.a = au.value.trim();
      save(); closeSheet(); render(); toast('Aangepast');
    });
  }

  function openAdd() {
    var def = state.tab === 'stock' ? 'voorraad' : (nowKey() || '1');
    var opts = DESTS.map(function (d) { return '<option value="' + d.key + '"' + (d.key === def ? ' selected' : '') + '>' + d.label + '</option>'; }).join('');
    openSheet('Boek toevoegen',
      '<h3>Boek toevoegen</h3>' +
      '<form id="addform" style="display:flex;flex-direction:column;gap:12px" novalidate>' +
      '<div class="field"><label for="f-title">Titel</label><input id="f-title" type="text" autocomplete="off" placeholder="Bijv. Moby-Dick" required></div>' +
      '<div class="field"><label for="f-author">Auteur</label><input id="f-author" type="text" autocomplete="off" placeholder="Bijv. Herman Melville"></div>' +
      '<div class="field"><label for="f-dest">Waar</label><select id="f-dest">' + opts + '</select></div>' +
      '<div class="btnrow"><button type="button" class="btn" id="add-no">Annuleer</button><button type="submit" class="btn primary" id="add-yes" disabled>Toevoegen</button></div>' +
      '</form>', '#f-title');
    var title = $('f-title');
    title.addEventListener('input', function () { $('add-yes').disabled = title.value.trim() === ''; });
    $('add-no').addEventListener('click', closeSheet);
    $('addform').addEventListener('submit', function (e) {
      e.preventDefault();
      var t = title.value.trim(); if (!t) return;
      var m = $('f-dest').value;
      state.books.push({ id: 'n' + (state.nextId++), t: t, a: $('f-author').value.trim(), m: m, done: false });
      state.tab = m === 'voorraad' ? 'stock' : 'plan';
      filter.q = ''; filter.author = ''; $('q').value = ''; updateFilterUI();
      save(); closeSheet(); render();
      var sec = $('sec-' + m); if (sec) sec.scrollIntoView({ block: 'center', behavior: 'smooth' });
      toast('Toegevoegd aan ' + destLabel(m));
    });
  }

  function encode(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function decode(code) {
    var bin = atob(code.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function openBackup() {
    var code = encode({ v: 1, books: state.books });
    openSheet('Back-up',
      '<h3>Back-up</h3>' +
      '<p class="note">Je lijst staat alleen op deze telefoon. Kopieer de code en bewaar hem in een notitie. Plak hem hieronder om je lijst terug te zetten, ook op een nieuwe telefoon.</p>' +
      '<div class="field"><label for="f-code">Jouw code</label><textarea id="f-code" readonly></textarea></div>' +
      '<button class="btn primary" id="copy">Kopieer code</button>' +
      '<div class="field"><label for="f-restore">Code plakken</label><textarea id="f-restore" placeholder="Plak hier een eerder gekopieerde code"></textarea></div>' +
      '<p class="err" id="restore-err" hidden></p>' +
      '<button class="btn" id="restore">Herstel deze code</button>');
    $('f-code').value = code;
    $('copy').addEventListener('click', function () {
      var btn = this;
      var fallback = function () { var el = $('f-code'); el.focus(); el.select(); btn.textContent = 'Geselecteerd, kopieer met je toetsenbord'; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(function () { btn.textContent = 'Gekopieerd'; }, fallback);
        } else fallback();
      } catch (e) { fallback(); }
    });
    $('restore').addEventListener('click', function () {
      var err = $('restore-err');
      try {
        var d = decode($('f-restore').value.trim());
        var books = Array.isArray(d) ? d : d.books;
        if (!Array.isArray(books) || !books.every(function (b) { return b && typeof b.t === 'string' && typeof b.m === 'string'; })) throw new Error('vorm');
        var maxN = 0;
        books.forEach(function (b, i) {
          if (!b.id) b.id = 'r' + i;
          var n = parseInt(String(b.id).replace(/\D/g, ''), 10); if (n > maxN) maxN = n;
          b.done = !!b.done;
        });
        state.books = books; state.nextId = Math.max(state.nextId, maxN + 1);
        save(); closeSheet(); render(); toast('Lijst hersteld');
      } catch (e) {
        err.textContent = 'Deze code klopt niet. Kopieer hem opnieuw, helemaal.'; err.hidden = false;
      }
    });
  }

  // ---------- slepen (lang indrukken op telefoon, direct slepen met muis) ----------
  var drag = null, suppressClick = false, raf = null;
  var LONGPRESS = 380, SLOP = 10;

  function startCandidate(row, x, y, isTouch) {
    drag = { id: row.dataset.id, row: row, x0: x, y0: y, x: x, y: y, active: false, isTouch: isTouch, over: null, springKey: null, springTimer: null };
    if (isTouch) drag.timer = setTimeout(activate, LONGPRESS);
  }
  function activate() {
    if (!drag || drag.active) return;
    drag.active = true;
    if (sw) sw.blocked = true;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    var r = drag.row.getBoundingClientRect();
    drag.offX = drag.x - r.left; drag.offY = drag.y - r.top;
    var g = drag.row.cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px'; g.setAttribute('aria-hidden', 'true');
    document.body.appendChild(g); drag.ghost = g;
    drag.row.classList.add('is-dragging');
    document.body.classList.add('dragging');
    moveGhost(); updateOver(); loop();
  }
  function moveGhost() {
    if (!drag || !drag.ghost) return;
    drag.ghost.style.transform = 'translate(' + (drag.x - drag.offX) + 'px,' + (drag.y - drag.offY) + 'px) rotate(1.5deg) scale(1.02)';
  }
  function setOver(el) {
    if (drag.overEl === el) return;
    if (drag.overEl) drag.overEl.classList.remove('is-over');
    drag.overEl = el; drag.over = el ? el.dataset.drop : null;
    if (el) el.classList.add('is-over');
  }
  function clearMarker() {
    if (drag && drag.markEl) drag.markEl.classList.remove('drop-before', 'drop-after');
    if (drag) { drag.markEl = null; drag.beforeId = null; }
  }
  function updateMarker(target) {
    clearMarker();
    if (!target || target.tagName !== 'SECTION') return;
    var rows = Array.prototype.slice.call(target.querySelectorAll('.row')).filter(function (r) { return r.dataset.id !== drag.id; });
    var before = null;
    for (var i = 0; i < rows.length; i++) {
      var rr = rows[i].getBoundingClientRect();
      if (drag.y < rr.top + rr.height / 2) { before = rows[i]; break; }
    }
    if (before) { before.classList.add('drop-before'); drag.markEl = before; drag.beforeId = before.dataset.id; }
    else if (rows.length) { rows[rows.length - 1].classList.add('drop-after'); drag.markEl = rows[rows.length - 1]; }
  }
  function updateOver() {
    var el = document.elementFromPoint(drag.x, drag.y);
    var target = el ? el.closest('[data-drop],[data-spring]') : null;
    setOver(target && target.dataset.drop ? target : null);
    updateMarker(target && target.dataset.drop ? target : null);
    var spring = target && target.dataset.spring && target.dataset.spring !== state.tab ? target.dataset.spring : null;
    if (spring !== drag.springKey) {
      clearTimeout(drag.springTimer); drag.springKey = spring;
      if (spring) drag.springTimer = setTimeout(function () {
        if (!drag) return;
        setOver(null); setTab(spring);
        drag.row = list.querySelector('.row[data-id="' + drag.id + '"]') || drag.row;
        if (drag.row) drag.row.classList.add('is-dragging');
        drag.springKey = null; updateOver();
      }, 550);
    }
  }
  function loop() {
    if (!drag || !drag.active) return;
    var r = list.getBoundingClientRect(), edge = 70, sp = 0;
    if (drag.y < r.top + edge && drag.y > r.top - 40) sp = -Math.ceil((r.top + edge - drag.y) / 6);
    else if (drag.y > r.bottom - edge) sp = Math.ceil((drag.y - (r.bottom - edge)) / 6);
    if (sp) { list.scrollTop += sp; updateOver(); }
    raf = requestAnimationFrame(loop);
  }
  function finish(commit) {
    if (!drag) return;
    clearTimeout(drag.timer); clearTimeout(drag.springTimer);
    if (raf) cancelAnimationFrame(raf), raf = null;
    if (drag.active) {
      var key = drag.over, id = drag.id, beforeId = drag.beforeId;
      if (drag.markEl) drag.markEl.classList.remove('drop-before', 'drop-after');
      if (drag.overEl) drag.overEl.classList.remove('is-over');
      if (drag.ghost) drag.ghost.remove();
      var row = list.querySelector('.row[data-id="' + id + '"]'); if (row) row.classList.remove('is-dragging');
      document.body.classList.remove('dragging');
      suppressClick = true; setTimeout(function () { suppressClick = false; }, 350);
      drag = null;
      if (commit && key) moveTo(id, key, beforeId);
    } else drag = null;
  }

  // touch
  list.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    if (e.target.closest('button')) return;
    var row = e.target.closest('.row'); if (!row) return;
    var t = e.touches[0]; startCandidate(row, t.clientX, t.clientY, true);
    // De puntjes links zijn een greep: daar begint het slepen direct, zonder lang indrukken.
    if (e.target.closest('.grip')) { clearTimeout(drag.timer); activate(); }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!drag) return;
    var t = e.touches[0]; drag.x = t.clientX; drag.y = t.clientY;
    if (!drag.active) {
      if (Math.abs(drag.x - drag.x0) > SLOP || Math.abs(drag.y - drag.y0) > SLOP) { clearTimeout(drag.timer); drag = null; }
      return;
    }
    e.preventDefault(); moveGhost(); updateOver();
  }, { passive: false });
  document.addEventListener('touchend', function () { finish(true); });
  document.addEventListener('touchcancel', function () { finish(false); });
  list.addEventListener('contextmenu', function (e) { if (e.target.closest('.row')) e.preventDefault(); });

  // muis
  list.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || e.target.closest('button,input')) return;
    var row = e.target.closest('.row'); if (!row) return;
    startCandidate(row, e.clientX, e.clientY, false);
  });
  document.addEventListener('mousemove', function (e) {
    if (!drag || drag.isTouch) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active) { if (Math.abs(drag.x - drag.x0) > 5 || Math.abs(drag.y - drag.y0) > 5) activate(); return; }
    moveGhost(); updateOver();
  });
  document.addEventListener('mouseup', function () { if (drag && !drag.isTouch) finish(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drag) finish(false); });

  // ---------- start ----------
  render();
  var nk = nowKey();
  if (state.tab === 'plan' && nk) { var s = $('sec-' + nk); if (s) s.scrollIntoView({ block: 'start' }); }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
