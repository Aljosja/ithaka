<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ithaka · Leesjaar 2027</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A190E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4EEE6; --surface:#FFFCF8; --ink:#2A1D14; --muted:#7A6656; --soft:#5C4A3C;
  --line:#E6DACB; --line2:#D9CAB8; --track:#F1E8DC; --hover:#F4EEE6;
  --accent:#B5541E; --accent-ink:#FFFFFF; --accent-soft:#F6E3D3;
  --ok:#3C8A7A; --danger:#A3352B; --scrim:rgba(42,29,20,.45);
  --hd1:#3E2616; --hd2:#2A190E; --hd-ink:#F6EDE2; --hd-soft:#D9C9B6; --hd-glass:rgba(246,237,226,.09); --sun:#E0873A; --sun-soft:#F6C98A;
  --unplan:#2B4B7A; --tgt:#9C8A78;
  --lib:#2B4B7A; --lib-soft:#EEF3FA; --lib-line:#C9D5E8; --lib-due:#A3352B;
  --kb:rgba(224,135,58,.3); --nav-on:#F6E3D3; --nav-on-ink:#8A3812;
  --f-title:'Literata', Georgia, 'Times New Roman', serif;
  --f-ui:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#17110C; --surface:#22180F; --ink:#F1E6D8; --muted:#B8A593; --soft:#D2C1AE;
    --line:#382A1F; --line2:#4A3829; --track:#2A1F16; --hover:#2A1F16;
    --accent:#E0873A; --accent-ink:#22150B; --accent-soft:#3A2414;
    --ok:#6FBFAE; --danger:#E38A80; --scrim:rgba(0,0,0,.55);
    --unplan:#8FB0E3; --tgt:#8C7B6B;
    --lib:#8FB0E3; --lib-soft:#1B2330; --lib-line:#2E3B52; --lib-due:#E38A80;
    --hd1:#1E130B; --hd2:#140D08; --nav-on:#3A2414; --nav-on-ink:#F6C98A;
    color-scheme:dark;
  }
  .tag,.tagopt:not(.is-on),.lnm b,.showbtn,.lchip{color:var(--tag-c)!important}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ground)}

/* kop */
.top{position:relative;background:linear-gradient(180deg,var(--hd1) 0%,var(--hd2) 100%);color:var(--hd-ink);padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;gap:8px}
h1{margin:0;min-width:0;font-family:var(--f-title);font-weight:600;font-size:23px;letter-spacing:-.01em;white-space:nowrap}
.yearbtn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;padding:0;cursor:pointer;text-align:left;min-height:44px}
.yearbtn svg{flex:none;opacity:.7;margin-top:3px}
.pillbtn{flex:none;min-height:38px;border:0;border-radius:999px;background:rgba(224,135,58,.16);color:var(--sun-soft);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 10px 0 12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.nowbar{display:flex;align-items:center;gap:10px;min-height:46px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.nowbar .lab{flex:none;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.nowbar .list{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .warn{flex:none;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.nowbar svg{flex:none;color:var(--muted)}
.libbar{display:flex;align-items:center;gap:10px;min-height:44px;border:0;border-bottom:1px solid var(--line);background:var(--lib-soft);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.libbar .lab{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lib)}
.libbar .list{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libbar .warn{flex:none;width:8px;height:8px;border-radius:50%;background:var(--lib-due)}
.libbar svg{flex:none}
.lb{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:700;line-height:1.3;border-radius:999px;padding:2px 8px 2px 6px;font-variant-numeric:tabular-nums}
.lb.want{color:var(--lib);border:1.5px solid var(--lib-line)}
.lb.loan{color:#FFFFFF;background:var(--lib)}
.lb.loan.due{background:var(--lib-due)}
@media (prefers-color-scheme: dark){ .lb.loan{color:#14100C} }
.libbox{border:1px solid var(--lib-line);background:var(--lib-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.libbox .lbl{color:var(--lib);display:flex;align-items:center;gap:6px;margin:0}
.libbox .seg2{background:var(--lib-line)}
.libbox .note{margin:0;font-size:13.5px}
.libbox .linkbtn{color:var(--lib)}
.lgrp{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lib)}
.lgrp span{color:var(--muted);letter-spacing:0}
.lrow2{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 0;text-align:left;cursor:pointer;color:var(--ink)}
.lrow2 .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow2 .tx b{font-family:var(--f-title);font-weight:500;font-size:15px;line-height:1.25}
.lrow2 .tx span{font-size:12.5px;color:var(--muted)}
.lrow2 .r{flex:none;font-size:12.5px;font-weight:700;text-align:right;line-height:1.3;color:var(--soft)}
.lrow2 .r.now{color:var(--lib)}
.lrow2 .r.due{color:var(--lib-due)}
.hbtn{position:relative;width:42px;height:42px;flex:none;border:0;border-radius:12px;background:var(--hd-glass);color:var(--hd-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn.is-on{background:var(--hd-ink);color:#2A1D14}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--sun);color:#2A1D14;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--hd-glass)}
.segbtn{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--hd-soft);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.segbtn .n{font-weight:500;font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.segbtn.is-on{background:var(--hd-ink);color:#2A1D14}
.segbtn.is-over{background:rgba(224,135,58,.35);color:var(--hd-ink)}
.searchrow{display:flex;gap:8px}
.hsearch{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.hsearch > svg{position:absolute;left:12px;color:#7A6656;pointer-events:none}
.hsearch input{width:100%;min-height:44px;border:0;border-radius:12px;background:#FFFCF8;color:#2A1D14;font:inherit;font-size:16px;padding:0 42px 0 38px;-webkit-appearance:none;appearance:none}
.hsearch input::-webkit-search-cancel-button{display:none}
.hsearch .x{position:absolute;right:2px;width:40px;height:40px;border:0;background:transparent;color:#7A6656;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px}
.progline{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--sun);border-radius:0 2px 2px 0;transition:width .3s ease}

/* actieve filters */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) 2px max(12px,env(safe-area-inset-left,0px))}
.fchip{display:inline-flex;align-items:center;gap:4px;min-height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:0 8px 0 12px;cursor:pointer}
.fchip svg{opacity:.7}
.fclear{min-height:34px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:0 6px}

/* lijst */
main{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(12px,env(safe-area-inset-right,0px)) 92px max(12px,env(safe-area-inset-left,0px))}
.mbar{position:sticky;top:0;z-index:3;background:var(--ground);display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none;margin:0 -2px}
.mbar::-webkit-scrollbar{display:none}
.mchip{flex:none;min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.mchip.is-done{color:var(--muted);background:transparent}
.mchip.is-now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.results{margin:12px 6px 2px;font-size:13px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:6px;padding:6px 0 8px;border-radius:14px;border:1.5px dashed transparent}
.sec.is-over{border-color:var(--accent);background:var(--accent-soft)}
.sechead{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;padding:0 6px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.sechead .h{font-family:var(--f-title);font-weight:600;font-size:17px}
.nowtag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sechead .sp{flex:1}
.sechead .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sechead .ok{color:var(--ok);display:flex}
.chev{display:flex;color:var(--muted);transition:transform .15s ease}
.chev.is-open{transform:rotate(180deg)}
.sec.is-collapsed .sechead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.row{position:relative;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 2px 2px 2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.row.is-done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row.is-dragging{opacity:.3}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:2px;background:var(--accent);pointer-events:none}
.row.drop-before::before{top:-5px}
.row.drop-after::after{bottom:-5px}
.grip{width:34px;height:44px;flex:none;color:var(--line2);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.st{width:44px;height:44px;flex:none;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.st i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.st-open i{border:2px solid var(--muted)}
.st-bezig i{border:2px solid var(--accent);color:var(--accent)}
.st-done i{background:var(--accent);color:var(--accent-ink)}
.txt{flex:1;display:flex;flex-direction:column;min-width:0;gap:1px;padding:6px 0}
.t{font-family:var(--f-title);font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.a{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px 2px 6px;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--tag-d)}
.tag i{width:7px;height:7px;border-radius:50%;display:block;background:var(--tag-c)}
.span{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--soft);background:var(--track);font-variant-numeric:tabular-nums}
.cont{display:flex;align-items:center;gap:8px;min-height:40px;border:1px dashed var(--line2);border-radius:10px;background:transparent;color:var(--muted);font-size:13px;text-align:left;padding:0 12px;cursor:pointer;width:100%}
.cont span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont b{font-weight:600;color:var(--soft)}
.cont em{flex:none;font-style:normal;font-size:12px}
.cont.is-done b{text-decoration:line-through}
.iconbtn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--hover)}
.empty{margin:0 6px;padding:8px 0;border-top:1px dashed var(--line2);font-size:13px;color:var(--muted)}

.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(42,29,20,.25);opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}
.slide-l{animation:slideL .22s ease}
.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}

.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(120,50,15,.35);z-index:5}

/* onderblad */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:40}
.backdrop{position:absolute;inset:0;border:0;background:var(--scrim);cursor:pointer;width:100%}
.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.handle{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line2)}
.sheet h3{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tagopt{min-height:38px;border-radius:999px;border:1.5px solid var(--tag-c);background:transparent;color:var(--tag-d);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}
.tagopt.is-on{background:var(--tag-c);color:#FFFFFF}
.addtag{min-height:38px;border-radius:999px;border:1.5px dashed var(--line2);background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}
.destgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dest{min-height:42px;border:1px solid var(--line);background:var(--ground);border-radius:10px;font-size:12.5px;font-weight:500;cursor:pointer}
.dest:hover{border-color:var(--accent)}
.dest.wide{grid-column:span 5}
.dest.is-cur{background:var(--ink);color:var(--ground);border-color:var(--ink);cursor:default}
.seg2{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--track)}
.seg2 button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13px;color:var(--soft);cursor:pointer}
.seg2 button.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(42,29,20,.12)}
.btnrow{display:flex;gap:8px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.photorow{display:flex;gap:12px;flex-wrap:wrap}
.linkbtn.sm{min-height:32px;font-size:13px}
.linkbtn.muted{color:var(--muted)}
.linkbtn{min-height:40px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start;padding:0 2px}
.linkdanger{min-height:44px;border:0;background:transparent;color:var(--danger);font-weight:600;font-size:14px;cursor:pointer;align-self:flex-start;padding:0 2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);width:100%}
.field textarea{min-height:72px;resize:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.note{margin:0;font-size:14px;line-height:1.45;color:var(--soft)}
.err{margin:0;font-size:13px;color:var(--danger)}
.tagrow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:0 0 0 4px}
.tagrow.is-edit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tagrowbtn{flex:1;min-width:0;min-height:46px;border:0;background:transparent;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;padding:0 6px}
.tagrowbtn i{width:14px;height:14px;border-radius:50%;display:block;flex:none;background:var(--tag-c)}
.tagrowbtn .tn{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tagrowbtn .tc{font-size:12px;color:var(--muted);flex:none}
.tagrow .sure{min-height:36px;border:0;border-radius:9px;background:var(--danger);color:var(--surface);font-weight:600;font-size:13px;padding:0 12px;margin-right:4px;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:320px}
.sw{aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.sw.is-on{box-shadow:0 0 0 2px var(--ink)}
.preview{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.preview .tag svg{flex:none}
.tico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.swline{display:flex;align-items:center;gap:12px}
.swline span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.swline b{font-size:14px;font-weight:600}
.swline em{font-style:normal;font-size:12.5px;line-height:1.35;color:var(--muted)}
.switch{position:relative;width:48px;height:30px;flex:none;border:0;border-radius:15px;background:var(--line2);cursor:pointer;padding:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(42,29,20,.3);transition:left .15s}
.switch.is-on{background:var(--accent)}
.switch.is-on::after{left:21px}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:340px}
.icb{height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
.icb.is-on{border:2px solid var(--tag-c);color:var(--tag-c)}
.tagopt.is-line{display:inline-flex;align-items:center;gap:6px;padding-left:10px}

.orow .oy{font-family:var(--f-title);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.orow .oi{display:flex;color:var(--muted)}
.orow .ot{display:flex;flex-direction:column;gap:1px;min-width:0}
.orow .ot b{font-family:var(--f-title);font-weight:500;font-size:15px;line-height:1.25}
.orow .ot span{font-size:12.5px;color:var(--muted)}
.orow.is-done .ot b{color:var(--soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app">

<script>

  function iconOf(t) { for (var i = 0; i < ICONS.length; i++) if (ICONS[i].id === (t && t.icon)) return ICONS[i]; return ICONS[0]; }

  }
  function defaultTags() { return [{ id: 'opt', name: 'optioneel', color: 1 }, { id: 'her', name: 'herlezen', color: 3 }]; }

  // Nieuwe gebruikers beginnen met een leeg leesjaar; je eigen lijst staat op je apparaat (en in je back-up).
  var SEED = [];

  // ---------- opslag ----------
  function seedState() {

      v: 3, tab: 'plan', nextId: SEED.length + 1, nextTag: 1, coll: {}, tags: defaultTags(),

    return st;
  }
  // "(t/m juni)", "(uit op 16 juni)", "(26 mrt – 16 mei)" in de titel → periode 'gepland t/m'

  function migrateUntil(st) {
    st.books.forEach(function (b) {
      if (b.until !== undefined && b.until !== null) return;
      b.until = null;

      var m = b.t.match(/\s*\((?:t\/m|uit op \d+|\d+ [a-z]+ [–-] \d+) ([a-z]+)\)\s*$/i);
      if (!m) return;
      var end = MONTH_WORDS[m[1].toLowerCase()];
      if (!end || end <= start) return;
      b.until = String(end);
      b.t = b.t.slice(0, m.index).trim();
    });
  }
  // Oude versie: "(herlezen, optioneel)" en "(optioneel)" in de titel worden tags.
  function migrateTitles(st) {
    st.books.forEach(function (b) {
      if (/\s*\(herlezen, optioneel\)\s*$/.test(b.t)) { b.t = b.t.replace(/\s*\(herlezen, optioneel\)\s*$/, ''); b.tags = ['her', 'opt']; }

  }
  function normalizeBooks(books) {
    books.forEach(function (b, i) {
      if (!b.id) b.id = 'r' + i;

  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.books)) {
          var st = { v: d.v || 1, tab: d.tab === 'stock' ? 'stock' : 'plan', nextId: d.nextId || 1000, nextTag: d.nextTag || 1, coll: d.coll || {}, books: d.books, tags: Array.isArray(d.tags) ? d.tags : null, lastBackup: d.lastBackup || null, year: d.year || null, years: Array.isArray(d.years) ? d.years : [], imported: Array.isArray(d.imported) ? d.imported : [], lib: d.lib && typeof d.lib === 'object' ? d.lib : null,
            films: Array.isArray(d.films) ? d.films : [], nextFilm: d.nextFilm || 1, mode: d.mode === 'films' ? 'films' : 'books', fyear: d.fyear === 0 ? 0 : (d.fyear || null), fsort: d.fsort || 'title', ftab: d.ftab === 'watch' ? 'watch' : 'seen', sview: d.sview === 'own' || d.sview === 'want' ? d.sview : 'all', best: d.best && typeof d.best === 'object' ? d.best : {} };
          normalizeBooks(st.books);
          st.books.forEach(function (b) { if (b.lib === 'loan' && !b.loanDate) { b.loanDate = new Date().toISOString().slice(0, 10); b.renewed = 0; } });

    } catch (e) {}

  }
  var state = load();
  // leesjaren: elk gepland boek hoort bij een jaar (b.y); de voorraad hoort bij alle jaren
  function fixYears() {
    state.books.forEach(function (b) { if (b.m !== 'voorraad' && !b.y) b.y = LEGACY_YEAR; });
    var ys = (state.years || []).map(Number).filter(function (y) { return y > 1900 && y < 3000; });
    state.books.forEach(function (b) { if (b.y && ys.indexOf(+b.y) < 0) ys.push(+b.y); });
    if (!ys.length) { var d = new Date(); ys.push(d.getFullYear() + (d.getMonth() >= 9 ? 1 : 0)); }
    ys.sort(function (a, b) { return a - b; });

    if (!state.year || ys.indexOf(+state.year) < 0) {

      state.year = ys.indexOf(cy) >= 0 ? cy : ys.filter(function (y) { return y > cy; })[0] || ys[ys.length - 1];

    state.imported = (Array.isArray(state.imported) ? state.imported : []).map(Number).filter(function (y) { return ys.indexOf(y) >= 0; });
    if (!Array.isArray(state.films)) state.films = [];
    state.films.forEach(function (f) { if (!Array.isArray(f.tags)) f.tags = []; if (!Array.isArray(f.links)) f.links = []; });
    var mx = 0; state.films.forEach(function (f) { var n = parseInt(String(f.id).replace(/\D/g, ''), 10); if (n > mx) mx = n; });
    state.nextFilm = Math.max(state.nextFilm || 1, mx + 1);

    if (state.ftab !== 'watch') state.ftab = 'seen';

  fixYears();
  function ck(key) { return key === 'voorraad' ? key : YEAR + ':' + key; }   // inklappen onthouden per jaar
  // geïmporteerd jaar (uit Goodreads): leesgeschiedenis zonder planning

  save();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- eigen foto's van kaften (IndexedDB; in het geheugen gespiegeld) ----------
  var photos = {};
  var PH = (function () {
    var dbp = null;

      if (!dbp) dbp = new Promise(function (res, rej) {
        try {
          var r = indexedDB.open('ithaka-photos', 1);

        });

      all: function () { return run('readonly', function (st, done) { var o = {}; var c = st.openCursor(); c.onsuccess = function () { var cur = c.result; if (cur) { o[cur.key] = cur.value; cur.continue(); } else done(o); }; }); },

    };
  })();
  PH.all().then(function (o) { if (o) photos = o; }).catch(function () {});
  function setPhoto(id, url) {

  }
  // camera openen (op de telefoon), foto verkleinen tot max. 480 px en als JPEG teruggeven
  function takePhoto(cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);

      };

      img.src = url;
    });

  }
  function coverHTML(b, cls, own) {
    var src = own || photos[b.id];
    var img = src ? '<img src="' + esc(src) + '" alt="">' :

    return '<span class="cover is-none' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + ICON_BOOK + img + '</span>';
  }

  // ---------- hulpjes ----------
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // toevoegen
  // ---------- ISBN ----------
  function isbnDigits(v) { return String(v || '').toUpperCase().replace(/[^0-9X]/g, ''); }
  function isbn13ok(d) {
    if (!/^97[89]\d{10}$/.test(d)) return false;
    var sum = 0; for (var i = 0; i < 12; i++) sum += (+d[i]) * (i % 2 ? 3 : 1);
    return (10 - sum % 10) % 10 === +d[12];
  }
  function isbn10ok(d) {
    if (!/^\d{9}[\dX]$/.test(d)) return false;
    var sum = 0; for (var i = 0; i < 10; i++) sum += (d[i] === 'X' ? 10 : +d[i]) * (10 - i);
    return sum % 11 === 0;
  }
  // geeft een geldig ISBN-13 terug, of null
  function toIsbn13(v) {
    var d = isbnDigits(v);
    if (d.length === 13) return isbn13ok(d) ? d : null;
    if (d.length === 10 && isbn10ok(d)) {
      var b = '978' + d.slice(0, 9), sum = 0;
      for (var i = 0; i < 12; i++) sum += (+b[i]) * (i % 2 ? 3 : 1);
      return b + ((10 - sum % 10) % 10);
    }
    return null;
  }
  function fmtIsbn(d) { return d || ''; }
  // Eerst Google Books (met eigen sleutel als die is ingesteld), anders Open Library.
  var GB_KEY_STORE = 'ithaka.gbkey';
  function gbKey() { try { return localStorage.getItem(GB_KEY_STORE) || ''; } catch (e) { return ''; } }
  function httpErr(src, status) { var e = new Error(src + ' ' + status); e.src = src; e.status = status; return e; }
  function fromGoogle(isbn) {
    var k = gbKey();
    return fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn + (k ? '&key=' + encodeURIComponent(k) : ''), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw httpErr('Google Books', r.status);
      return r.json();
    }, function () { throw httpErr('Google Books', 0); }).then(function (d) {
      if (!d || !d.totalItems || !d.items || !d.items.length) return null;
      var v = d.items[0].volumeInfo || {};
      var img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
      return {
        src: 'Google Books', t: (v.title || '').trim(), a: (v.authors || []).join(', '),
        pages: v.pageCount || null, year: (v.publishedDate || '').slice(0, 4) || null,
        publisher: v.publisher || '', cover: img ? img.replace(/^http:/, 'https:') : ''
      };
    });
  }
  function fromOpenLibrary(isbn) {
    return fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + isbn + '&format=json&jscmd=data', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw httpErr('Open Library', r.status);
      return r.json();
    }, function () { throw httpErr('Open Library', 0); }).then(function (d) {
      var v = d && d['ISBN:' + isbn];
      if (!v || !v.title) return null;
      var y = String(v.publish_date || '').match(/\d{4}/);
      return {
        src: 'Open Library', t: (v.title + (v.subtitle ? '' : '')).trim(), a: (v.authors || []).map(function (x) { return x.name; }).join(', '),
        pages: v.number_of_pages || null, year: y ? y[0] : null,
        publisher: (v.publishers && v.publishers[0] && v.publishers[0].name) || '',
        cover: (v.cover && (v.cover.medium || v.cover.small)) || ''
      };
    });
  }
  // KB: Nederlandse Bibliografie Totaal, via de openbare zoekvraag "ISBN zoeken in NBT".
  // label = "Titel / Auteur ; vertaald door …"

  function noteItems() {
    var out = [];
    state.books.forEach(function (b) { if (b.notes) out.push({ k: 'book', id: b.id, t: b.t, who: b.a || '', when: readYearOf(b) || (b.status === 'bezig' ? 'bezig' : ''), rating: b.rating, tags: b.tags || [], text: b.notes, sort: b.finished || b.started || '' }); });
    state.films.forEach(function (f) { if (f.notes) out.push({ k: 'film', id: f.id, t: f.t, who: f.dir || '', when: f.d ? f.d.slice(0, 4) : '', rating: f.rating, tags: f.tags || [], text: f.notes, sort: f.d || '' }); });
    return out.sort(function (a, b) { return b.sort < a.sort ? -1 : b.sort > a.sort ? 1 : 0; });
  }
  function notesFiltered() {
    var q = norm(notesView.q.trim());
    return noteItems().filter(function (x) {
      if (notesView.kind !== 'all' && x.k !== notesView.kind) return false;
      if (notesView.line && x.tags.indexOf(notesView.line) < 0) return false;
      if (q) { var hay = norm(x.t + ' ' + x.who + ' ' + x.text); if (!q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; })) return false; }
      return true;
    });
  }
  function notesListHTML() {
    var xs = notesFiltered();
    if (!xs.length) return '<p class="note">Geen aantekeningen gevonden.</p>';
    return '<p class="pgnote" style="margin:0">' + xs.length + (xs.length === 1 ? ' aantekening' : ' aantekeningen') + '</p>' + xs.map(function (x) {
      var ls = x.tags.map(findTag).filter(function (t) { return t && t.line; });
      return '<button class="ncard" data-n="' + x.k + ':' + esc(x.id) + '"><span class="nh"><span class="nk">' + (x.k === 'film' ? ICON_FILM : ICON_BOOK16) + '</span><b>' + esc(x.t) + '</b>' + (x.rating ? '<span class="tstar">★ ' + fmtRating(x.rating) + '</span>' : '') + '</span>' +
        '<span class="nm">' + esc([x.who, x.when].filter(Boolean).join(' · ')) + '</span>' +
        (ls.length ? '<span class="tags">' + ls.map(function (t) { return '<span class="lchip" style="' + tagVars(t) + ';background:' + pal(t).c + '22">' + iconSVG(t, 12) + esc(t.name) + '</span>'; }).join('') + '</span>' : '') +
        '<span class="nt">' + esc(x.text) + '</span></button>';
    }).join('');
  }
  function notesText() {
    var xs = notesFiltered(), L = notesView.line ? findTag(notesView.line) : null;
    var head = '# Aantekeningen' + (L ? ': ' + L.name : '') + (notesView.q.trim() ? ' (zoekterm: ' + notesView.q.trim() + ')' : '') + '\n\n';
    return head + xs.map(function (x) {
      return '## ' + x.t + (x.who ? ' — ' + x.who : '') + '\n' + [x.k === 'film' ? 'film' : 'boek', x.when ? (x.k === 'film' ? 'gezien ' : 'gelezen ') + x.when : '', x.rating ? '★ ' + fmtRating(x.rating) : ''].filter(Boolean).join(' · ') + '\n\n' + x.text.trim() + '\n';
    }).join('\n');
  }
  function openNotes() {
    var lines = lineTags();
    openSheet('Aantekeningen',
      '<div class="sheethead"><h3>Aantekeningen</h3><button class="linkbtn" id="nt-done" style="align-self:center">Klaar</button></div>' +
      '<div class="hsearch nsearch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="nt-q" type="search" placeholder="Zoek in je aantekeningen" autocomplete="off" aria-label="Zoek in je aantekeningen"></div>' +
      '<div class="seg2 sm" role="group" aria-label="Soort">' + [['all', 'Alles'], ['book', 'Boeken'], ['film', 'Films']].map(function (o) { return '<button data-nk="' + o[0] + '" class="' + (notesView.kind === o[0] ? 'is-on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>' +
      (lines.length ? '<div class="chips nlines"><button class="tagopt' + (notesView.line ? '' : ' is-on') + '" data-nl="" style="--tag-c:var(--ink);--tag-d:var(--ink)">Alle lijnen</button>' + lines.map(function (t) { var on = notesView.line === t.id; return '<button class="tagopt is-line' + (on ? ' is-on' : '') + '" data-nl="' + esc(t.id) + '" style="' + tagVars(t) + '">' + iconSVG(t, 14, on ? '#FFFFFF' : null) + esc(t.name) + '</button>'; }).join('') + '</div>' : '') +
      '<div id="nt-list" class="nlist">' + notesListHTML() + '</div>' +
      '<div class="btnrow dfoot"><button class="btn" id="nt-copy">Kopieer als tekst</button><button class="btn" id="nt-save">Bewaar als bestand</button></div>');
    var qi = $('nt-q'); qi.value = notesView.q;
    var refresh = function () { $('nt-list').innerHTML = notesListHTML(); bindCards(); };
    var bindCards = function () { sheet.querySelectorAll('[data-n]').forEach(function (el) { el.addEventListener('click', function () { var p = el.dataset.n.split(':'); if (p[0] === 'film') openFilm(p.slice(1).join(':')); else openDetail(p.slice(1).join(':')); }); }); };
    bindCards();
    qi.addEventListener('input', function () { notesView.q = qi.value; refresh(); });
    sheet.querySelectorAll('[data-nk]').forEach(function (el) { el.addEventListener('click', function () { notesView.kind = el.dataset.nk; openNotes(); }); });
    sheet.querySelectorAll('[data-nl]').forEach(function (el) { el.addEventListener('click', function () { notesView.line = el.dataset.nl; openNotes(); }); });
    $('nt-done').addEventListener('click', closeSheet);
    $('nt-copy').addEventListener('click', function () {
      var btn = this, txt = notesText();
      try { navigator.clipboard.writeText(txt).then(function () { btn.textContent = 'Gekopieerd'; }, function () { btn.textContent = 'Kopiëren lukte niet'; }); } catch (e) { btn.textContent = 'Kopiëren lukte niet'; }
    });
    $('nt-save').addEventListener('click', function () {
      var L = notesView.line ? findTag(notesView.line) : null;
      var name = 'aantekeningen' + (L ? '-' + norm(L.name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') : '') + '.md';
      var blob = new Blob([notesText()], { type: 'text/markdown' });
      try { var file = new File([blob], name, { type: 'text/markdown' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(function () {}); return; } } catch (e) {}
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
  }

  // ---------- jaar van ontstaan (boeken) via Wikidata ----------
  var originBusy = false;
  function originOf(x) { return x.k === 'film' ? (x.o.yr || null) : (x.o.orig || null); }
  function wdOrigin(books, onDone) {
    if (originBusy) return; originBusy = true;
    var i = 0, found = 0;
    var next = function () {
      if (i >= books.length) { originBusy = false; save(); onDone(found); return; }
      var b = books[i++], sur = norm(String(b.a || '').trim().split(/\s+/).pop() || '');
      var t = String(b.t || '').split(':')[0].replace(/\([^)]*\)/g, '').trim();
      fetch('https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=10&language=nl&uselang=nl&search=' + encodeURIComponent(t), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var ids = (d && d.search || []).map(function (x) { return x.id; }).filter(function (id) { return /^Q\d+$/.test(id); });
          if (!ids.length) return;
          var q = 'SELECT ?item ?authorLabel ?date ?wdate WHERE { VALUES ?item { ' + ids.map(function (x) { return 'wd:' + x; }).join(' ') + ' } ?item wdt:P50 ?author . OPTIONAL { ?item wdt:P577 ?date } OPTIONAL { ?item wdt:P629 ?w . ?w wdt:P577 ?wdate } SERVICE wikibase:label { bd:serviceParam wikibase:language "nl,en,mul". } }';
          return wdSparql(q).then(function (rows) {
            var best = null;
            rows.forEach(function (r) {
              if (sur && norm(r.authorLabel || '').indexOf(sur) < 0) return;
              [r.date, r.wdate].forEach(function (v) { var m = v && String(v).match(/^(-?\d{1,4})-/); if (!m) return; var y = +m[1]; if (y && (best === null || y < best)) best = y; });
            });
            if (best !== null && !b.orig) { b.orig = best; found++; }
          });
        })
        .catch(function () {})
        .then(function () { setTimeout(next, 150); });
    };
    next();
  }
  function fmtYear(y) { return y < 0 ? (-y) + ' v.C.' : String(y); }

  // ---------- meer: back-up, ordenen, bieb, weergave ----------
  var MI = {
    lijn: '<path d="M12 3v14M12 3l6 11h-6M4 18h16l-2.5 3h-11z"/>',
    tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
    jaar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    bieb: '<path d="M3 9l9-5 9 5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/>',
    imp: '<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
    pag: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
    note: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'
  };
  var CHEV_R = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  function mitHTML(id, ic, title, sub) {
    return '<button class="mit" id="' + id + '"><span class="mi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + MI[ic] + '</svg></span><span class="mt"><b>' + title + '</b><span>' + sub + '</span></span>' + CHEV_R + '</button>';
  }
  function openMore() {
    var box = $('more');
    var age = state.lastBackup ? daysSince(state.lastBackup.slice(0, 10)) : null, stale = age === null || age > 14;
    var bkT = age === null ? 'Nog geen back-up' : age === 0 ? 'Back-up van vandaag' : age === 1 ? 'Back-up van gisteren' : 'Back-up van ' + age + ' dagen geleden';
    var loans = libLoans(), wants = libWants();
    var nres = libRes().length;
    var libSub = [loans.length ? loans.length + ' geleend · eerst inleveren ' + dShort(dueISO(loans[0])) : '', nres ? nres + ' gereserveerd' : '', !loans.length && wants.length ? wants.length + ' wil je lenen' : ''].filter(Boolean).join(' · ') || 'Leenregels en catalogus';
    var nl = lineTags().length, nt = plainTags().length;
    var th = getTheme();
    box.innerHTML = '<div class="shead"><h2 style="padding:8px 6px">Meer</h2></div><div class="sbody">' +
      '<div class="mbk"><span class="mok' + (stale ? ' is-old' : '') + '" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' + (stale ? '<path d="M12 7v6M12 17h.01"/>' : '<path d="M5 12.5l4.5 4.5L19 7.5"/>') + '</svg></span>' +
        '<span class="t"><b>' + bkT + '</b><span>Je lijst staat alleen op dit apparaat.</span></span><button class="btn primary" id="m-bk">Nu bewaren</button></div>' +
      '<div class="mgrp"><p class="lbl">Ordenen</p><div class="mlist">' +
        mitHTML('m-tags', 'lijn', 'Lijnen en tags', nl + (nl === 1 ? ' lijn' : ' lijnen') + ' · ' + nt + ' tags, voor boeken en films') +
        mitHTML('m-years', 'jaar', 'Leesjaren en filmjaren', 'Kiezen, toevoegen of weghalen') +
        mitHTML('m-notes', 'note', 'Aantekeningen', noteItems().length + ' bij boeken en films · zoeken, per lijn, exporteren') + '</div></div>' +
      '<div class="mgrp"><p class="lbl">Bibliotheek</p><div class="mlist">' + mitHTML('m-lib', 'bieb', 'Bibliotheek', esc(libSub)) + '</div></div>' +
      '<div class="mgrp"><p class="lbl">Gegevens</p><div class="mlist">' +
        mitHTML('m-imp', 'imp', 'Herstellen en importeren', 'Back-up terugzetten, Goodreads of Letterboxd, ISBN-sleutel') +
        mitHTML('m-pages', 'pag', 'Bladzijden aanvullen', 'Ontbrekende bladzijden opzoeken bij de KB') + '</div></div>' +
      '<div class="mgrp"><p class="lbl">Weergave</p><div class="mlist"><div class="seg2" role="group" aria-label="Thema">' +
        [['auto', 'Automatisch'], ['light', 'Licht'], ['dark', 'Donker']].map(function (o) { return '<button data-theme-set="' + o[0] + '" class="' + (th === o[0] ? 'is-on' : '') + '" aria-pressed="' + (th === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div></div>' +
      '<p class="note" style="font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 0">Ithaka · lezen en kijken, onderweg</p></div>';
    box.hidden = false; navSync();
    $('m-bk').addEventListener('click', function () { saveBackupFile(); setTimeout(function () { if (!$('more').hidden) openMore(); }, 600); });
    $('m-tags').addEventListener('click', function () { openTags({ kind: 'more' }); });
    $('m-years').addEventListener('click', function () { openYears(); });
    $('m-notes').addEventListener('click', function () { openNotes(); });
    $('m-lib').addEventListener('click', function () { openLib(); });
    $('m-imp').addEventListener('click', function () { openBackup(); });
    $('m-pages').addEventListener('click', function () { openEnrichList(); });
    box.querySelectorAll('[data-theme-set]').forEach(function (el) { el.addEventListener('click', function () { setTheme(el.dataset.themeSet); openMore(); }); });
  }
  // thema: automatisch (telefoon), licht of donker; per apparaat, niet in de back-up
  var THEME_KEY = 'ithaka.theme', darkRules = null;
  function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme(t) {
    if (!darkRules) {
      darkRules = [];
      Array.prototype.forEach.call(document.styleSheets, function (ss) {
        var rules; try { rules = ss.cssRules; } catch (e) { return; }
        Array.prototype.forEach.call(rules || [], function (r) { if (r.media && /prefers-color-scheme:\s*dark/.test(r.media.mediaText)) darkRules.push({ r: r, orig: r.media.mediaText }); });
      });
    }
    darkRules.forEach(function (x) { try { x.r.media.mediaText = t === 'dark' ? 'all' : t === 'light' ? 'not all' : x.orig; } catch (e) {} });
  }
  function setTheme(t) { try { if (t === 'auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, t); } catch (e) {} applyTheme(t); }

  // ---------- start ----------
  if (getTheme() !== 'auto') applyTheme(getTheme());
  render();
  var nk = nowKey();
  if (state.tab === 'plan' && nk) {
    var s = $('sec-' + nk), owEl = list.querySelector('.ow');
    if (s && !owEl) list.scrollTop = Math.max(0, s.offsetTop - 4);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
